<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Puissance Dobble Pong — Interface mockup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111418;
      color: #f6f2e8;
    }
    .screen {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      box-sizing: border-box;
      background: radial-gradient(circle at top, #243347, #111418 60%);
    }
    .top { font-size: 20px; opacity: 0.85; letter-spacing: 1px; }
    .center {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap: 24px; flex:1;
    }
    .action {
      font-size: 74px; font-weight: 700; text-align:center;
      border: 4px solid #f6f2e8; border-radius: 20px; padding: 24px 40px;
      background: rgba(255,255,255,0.05);
    }
    .symbol {
      font-size: 44px; letter-spacing: 4px; padding: 10px 18px;
      background:#f6f2e8; color:#111418; border-radius: 999px;
    }
    .footer {
      display:flex; justify-content:space-between; font-size:18px; opacity:0.8;
    }
    .pill { border:1px solid rgba(255,255,255,0.35); padding:10px 16px; border-radius:999px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="top">PUISSANCE DOBBLE PONG — écran de jeu</div>
    <div class="center">
      <div class="action">JOUE 2 JETONS</div>
      <div class="symbol">SYMBOLE : FEU</div>
    </div>
    <div class="footer">
      <div class="pill">Mode : clown concret</div>
      <div class="pill">Progression : 3 / 10</div>
    </div>
  </div>
</body>
</html>
